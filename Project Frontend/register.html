<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recyclo - Register</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2196F3, #4CAF50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            padding: 1rem;
        }

        .register-box {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-height: 90vh;
            overflow-y: auto;
        }

        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 2rem;
            color: #2196F3;
            margin-bottom: 0.5rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .required {
            color: red;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .form-input:focus, .form-select:focus {
            border-color: #2196F3;
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .checkbox-group input {
            transform: scale(1.2);
        }

        .register-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #2196F3, #4CAF50);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }

        .register-btn:hover {
            opacity: 0.9;
        }

        .register-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .links {
            text-align: center;
            margin-top: 1rem;
        }

        .links a {
            color: #2196F3;
            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .back-home {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            text-decoration: none;
        }

        .back-home:hover {
            background: rgba(255,255,255,0.3);
        }

        .error {
            color: red;
            font-size: 0.9rem;
            margin-top: 0.25rem;
            display: none;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">← Home</a>

    <div class="register-box">
        <div class="register-header">
            <div class="logo">♻️ Recyclo</div>
            <h2>Create Account</h2>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label class="form-label">Name <span class="required">*</span></label>
                <input type="text" class="form-input" id="name" placeholder="Enter full name">
                <div class="error" id="nameError">Please enter your name</div>
            </div>

            <div class="form-group">
                <label class="form-label">Email <span class="required">*</span></label>
                <input type="email" class="form-input" id="email" placeholder="Enter email">
                <div class="error" id="emailError">Please enter valid email</div>
            </div>

            <div class="form-group">
                <label class="form-label">Contact Number <span class="required">*</span></label>
                <input type="text" class="form-input" id="contactNo" placeholder="Enter 10 digit number" maxlength="10">
                <div class="error" id="contactError">Please enter valid contact number</div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Date of Birth <span class="required">*</span></label>
                    <input type="date" class="form-input" id="dob">
                    <div class="error" id="dobError">Please select date of birth</div>
                </div>

                <div class="form-group">
                    <label class="form-label">Gender <span class="required">*</span></label>
                    <select class="form-select" id="gender">
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                    <div class="error" id="genderError">Please select gender</div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Password <span class="required">*</span></label>
                <input type="password" class="form-input" id="password" placeholder="Enter password (min 6 characters)">
                <div class="error" id="passwordError">Password must be at least 6 characters</div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms">
                <label for="terms">I agree to <a href="#" onclick="showTerms()">Terms & Conditions</a> <span class="required">*</span></label>
            </div>
            <div class="error" id="termsError">Please accept Terms & Conditions</div>

            <button type="submit" class="register-btn" id="registerBtn">Create Account</button>
        </form>

        <div class="links">
            <a href="login.html">Already have account? Login here</a>
        </div>
    </div>

    <script>
        // Only allow numbers in contact field
        document.getElementById('contactNo').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // Only allow letters in name field
        document.getElementById('name').addEventListener('input', function() {
            this.value = this.value.replace(/[^a-zA-Z\s]/g, '');
        });

        // Form submit
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const contactNo = document.getElementById('contactNo').value;
            const dob = document.getElementById('dob').value;
            const gender = document.getElementById('gender').value;
            const password = document.getElementById('password').value;
            const terms = document.getElementById('terms').checked;
            
            // Hide all errors
            document.querySelectorAll('.error').forEach(error => error.style.display = 'none');
            
            let isValid = true;
            
            // Simple validation
            if (name.length < 2) {
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            }
            
            if (!email.includes('@')) {
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }
            
            if (contactNo.length !== 10) {
                document.getElementById('contactError').style.display = 'block';
                isValid = false;
            }
            
            if (!dob) {
                document.getElementById('dobError').style.display = 'block';
                isValid = false;
            }
            
            if (!gender) {
                document.getElementById('genderError').style.display = 'block';
                isValid = false;
            }
            
            if (password.length < 6) {
                document.getElementById('passwordError').style.display = 'block';
                isValid = false;
            }
            
            if (!terms) {
                document.getElementById('termsError').style.display = 'block';
                isValid = false;
            }
            
            if (isValid) {
                document.getElementById('registerBtn').disabled = true;
                document.getElementById('registerBtn').textContent = 'Creating Account...';
                
                setTimeout(() => {
                    alert('Registration successful! You can now login.');
                    window.location.href = 'login.html';
                }, 2000);
            }
        });

        function showTerms() {
            alert('Terms & Conditions\n\n1. You must be 18+ to use this service\n2. Provide accurate information\n3. Follow e-waste disposal guidelines\n\nBy registering, you agree to these terms.');
        }
    </script>
</body>
</html>
