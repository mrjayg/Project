<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recyclo - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2196F3, #4CAF50);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .login-box {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 2rem;
            color: #2196F3;
            margin-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        .form-input:focus {
            border-color: #2196F3;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #2196F3, #4CAF50);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .links {
            text-align: center;
            margin-top: 1rem;
        }

        .links a {
            color: #2196F3;
            text-decoration: none;
            margin: 0 1rem;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .back-home {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            text-decoration: none;
        }

        .back-home:hover {
            background: rgba(255,255,255,0.3);
        }

        .error {
            color: red;
            font-size: 0.9rem;
            margin-top: 0.25rem;
            display: none;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-home">← Home</a>
    
    <div class="login-box">
        <div class="login-header">
            <div class="logo">♻️ Recyclo</div>
            <h2>Login</h2>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Contact Number</label>
                <input type="text" class="form-input" id="contactNo" placeholder="Enter 10 digit number" maxlength="10">
                <div class="error" id="contactError">Please enter valid contact number</div>
            </div>

            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" id="username" placeholder="Enter username">
                <div class="error" id="usernameError">Please enter username</div>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="password" placeholder="Enter password">
                <div class="error" id="passwordError">Please enter password</div>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="links">
            <a href="register.html">Create Account</a>
            <a href="#" onclick="showDemo()">Demo Login</a>
        </div>
    </div>

    <script>
        // Only allow numbers in contact field
        document.getElementById('contactNo').addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // Form submit
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const contactNo = document.getElementById('contactNo').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Hide all errors
            document.querySelectorAll('.error').forEach(error => error.style.display = 'none');
            
            let isValid = true;
            
            // Simple validation
            if (contactNo.length !== 10) {
                document.getElementById('contactError').style.display = 'block';
                isValid = false;
            }
            
            if (username.length < 3) {
                document.getElementById('usernameError').style.display = 'block';
                isValid = false;
            }
            
            if (password.length < 6) {
                document.getElementById('passwordError').style.display = 'block';
                isValid = false;
            }
            
            if (isValid) {
                alert('Login successful!');
                window.location.href = 'user-dashboard.html';
            }
        });

        function showDemo() {
            document.getElementById('contactNo').value = '9876543210';
            document.getElementById('username').value = 'demo';
            document.getElementById('password').value = 'demo123';
        }
    </script>
</body>
</html>
